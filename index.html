<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Museo WRO - Control</title>

  <!-- AQUÍ VAN LAS DOS LIBRERÍAS EXTERNAS -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>

  <style>
    body { font-family: Arial, sans-serif; text-align: center; background-color: #222; color: white; margin: 0; padding: 10px; }
    h2 { margin-bottom: 10px; }
    #stream-container { margin: 0 auto; max-width: 400px; background: #000; border-radius: 8px; overflow: hidden; }
    #video-stream { width: 100%; height: auto; display: block; }
    #qr-result { background: #333; margin: 10px auto; padding: 10px; max-width: 380px; border-radius: 6px; font-weight: bold; color: #0f0; }
    .controls { margin-top: 15px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin-left: auto; margin-right: auto; }
    button { padding: 15px; font-size: 18px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; }
    button:active { background: #0056b3; }
    .stop-btn { background: #dc3545; }
    .empty { visibility: hidden; }
  </style>
</head>
<body>

  <h2>Robot Museo WRO</h2>

  <!-- 1. CÁMARA EN VIVO -->
  <div id="stream-container">
    <img id="video-stream" src="" alt="Cargando video...">
  </div>

  <!-- 2. RESULTADO DE QR -->
  <div id="qr-result">Buscando QR...</div>

  <!-- 3. BOTONES DE NAVEGACIÓN -->
  <div class="controls">
    <div class="empty"></div>
    <button onclick="mover('F')">▲ Avanzar</button>
    <div class="empty"></div>
    <button onclick="mover('L')">◄ Izq</button>
    <button class="stop-btn" onclick="mover('S')">■ STOP</button>
    <button onclick="mover('R')">► Der</button>
    <div class="empty"></div>
    <button onclick="mover('B')">▼ Atrás</button>
    <div class="empty"></div>
  </div>

  <!-- CANVAS OCULTO PARA PROCESAR EL QR CON jsQR -->
  <canvas id="qr-canvas" style="display:none;"></canvas>

  <script>
    const esp32Ip = "http://192.168.4.1"; // IP predeterminada de la ESP32 en modo AP
    const imgStream = document.getElementById('video-stream');
    const qrResult = document.getElementById('qr-result');
    const canvas = document.getElementById('qr-canvas');
    const ctx = canvas.getContext('2d');

    let ultimoQR = "";

    // Actualizar la captura de imagen dinámicamente
    function actualizarStream() {
      const nuevaImg = new Image();
      nuevaImg.crossOrigin = "Anonymous";
      nuevaImg.onload = function() {
        imgStream.src = nuevaImg.src;
        escanearQR(nuevaImg);
      };
      nuevaImg.src = esp32Ip + "/capture?" + new Date().getTime();
    }

    // Enviar comandos de movimiento a la ESP32
    function mover(direccion) {
      fetch(esp32Ip + "/mover?dir=" + direccion)
        .catch(err => console.log("Error al mover:", err));
    }

    // Procesar la imagen con jsQR
    function escanearQR(imagen) {
      canvas.width = imagen.width;
      canvas.height = imagen.height;
      ctx.drawImage(imagen, 0, 0, canvas.width, canvas.height);
      
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);

      if (code && code.data !== ultimoQR) {
        ultimoQR = code.data;
        qrResult.innerText = "✓ QR Detectado: " + ultimoQR;
        
        // Notificar a la ESP32 para que lo mande por I2C
        fetch(esp32Ip + "/qr_detectado?val=" + encodeURIComponent(ultimoQR))
          .catch(err => console.log("Error al enviar QR:", err));
      }
    }

    // Iniciar bucle de refresco de video
    setInterval(actualizarStream, 200);
  </script>
</body>
</html>
