<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Robot ESP32-CAM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin-top: 50px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 250px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
            text-align: center;
        }
        .btn-container {
            margin: 10px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:active {
            background-color: #0056b3;
            transform: translateY(2px);
        }
        .stop {
            background-color: #DC3545;
        }
        .stop:active {
            background-color: #a71d2a;
        }
    </style>
</head>
<body>

    <h1>Control de Robot ESP32-CAM</h1>
    <p>Ingresa la IP que muestra la pantalla LCD:</p>
    <input type="text" id="espIp" placeholder="Ej: 192.168.4.2">
    
    <div class="btn-container">
        <button onclick="enviarComando('avanzar')">▲ Avanzar</button>
    </div>
    <div class="btn-container">
        <button onclick="enviarComando('retroceder')">▼ Retroceder</button>
        <button class="stop" onclick="enviarComando('detener')">■ Detener</button>
    </div>

    <script>
        function enviarComando(accion) {
            const ip = document.getElementById('espIp').value.trim();
            if (!ip) {
                alert("Por favor ingresa la dirección IP que aparece en la LCD.");
                return;
            }
            const url = `http://${ip}/${accion}`;
            
            fetch(url)
                .then(response => response.text())
                .then(data => console.log("Respuesta:", data))
                .catch(error => {
                    console.error('Error:', error);
                    alert("No se pudo conectar con el robot. Asegúrate de estar en la misma red Wi-Fi y que la IP sea correcta.");
                });
        }
    </script>

</body>
</html>
